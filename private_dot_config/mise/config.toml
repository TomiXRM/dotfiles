# mise configuration
# See: https://mise.jdx.dev/configuration.html
#
# 置き場所について: ここ (~/.config/mise/config.toml) が mise の「真のグローバル設定」で、
# カレントディレクトリを問わず効く。以前は ~/.mise.toml に置いていたが、あれは
# $HOME 配下でしか読まれない。外付けドライブ (/Volumes/...) や /tmp で作業すると
# 全ツールのバージョンが未設定になり、shim が
#   "No version is set for shim: starship"
# で落ちてプロンプトもシンタックスハイライトも壊れた。同じ轍を踏まないこと。

[tools]
# Python package manager (replaces pip, poetry, etc)
uv = "latest"

# Node.js LTS includes npm.
node = "lts"

# Agentic coding CLIs.
# codexはnpm配布を使う (github release backendはcodex-code-mode-hostを同梱しない)
"npm:@openai/codex" = "latest"
claude = "latest"

# Cosense (Scrapbox) CLI — 知識ベース連携 (Node >=24 必須)
"npm:@helpfeel/cosense-cli" = "latest"

# Agent multiplexer — tmux的にエージェントを並行管理し状態(done/blocked)を検知する端末
"github:ogulcancelik/herdr" = "latest"

# oh-my-pi (omp) — コーディングエージェント。プラグインと設定は
# packages/omp-plugins.txt と run_onchange_38_omp で復元する
"github:can1357/oh-my-pi" = "latest"

# Rust toolchain管理はrustupに一本化(mise未使用)。 `rustup update` で最新化する
"github:dandavison/delta" = "latest"

# Terminal file manager
yazi = "latest"

# Shell prompt
starship = "latest"

# JS runtime — herdr-browser プラグインが必要とする
bun = "latest"

# Family tree tool
"github:trasta298/keifu" = "latest"

# Mermaid CLI — 図のレンダリング
"npm:@mermaid-js/mermaid-cli" = "latest"

[settings]
# Enable experimental features
experimental = true

# Keep runtime installation explicit and predictable.
not_found_auto_install = false

# 新しいリリースを伏せない。mise の既定は数日経つまで ls-remote / upgrade から
# 新版を隠す(供給網対策)。実際 claude 2.1.257 が「昨日出たばかり」という理由で
# 候補に出ず、MISE_MINIMUM_RELEASE_AGE=0 を手で付けて回避する羽目になった。
minimum_release_age = "0s"
